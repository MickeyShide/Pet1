version: "3.12"

services:
  db:
    image: postgres:16-alpine
    container_name: fastapi_pet1-db-local
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-fastapi_pet_1}
    volumes:
      - db-data-local:/var/lib/postgresql/data
    networks:
      - local-net

  redis:
    image: redis:7-alpine
    container_name: fastapi_pet1-redis-local
    volumes:
      - redis-data-local:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fastapi_pet1-rabbitmq-local
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data-local:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-net

  minio:
    image: minio/minio:latest
    container_name: fastapi_pet1-minio-local
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data-local:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-net

  minio-init:
    image: minio/mc:latest
    container_name: fastapi_pet1-minio-init-local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-uploads} || true &&
      mc mb -p local/${S3_PUBLIC_BUCKET:-uploads} || true &&
      mc anonymous set download local/${S3_PUBLIC_BUCKET:-uploads} || true
      "
    networks:
      - local-net

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: fastapi_pet1-backend-local
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@db/fastapi_pet_1}
      SECRET_KEY: ${SECRET_KEY:-abcdefg}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-pet1-api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/var/log/app/backend.log}

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CACHE_PREFIX: ${REDIS_CACHE_PREFIX:-myapp:cache:}

      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-app}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

      # MinIO / S3
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://s3.xn--80aqenr9bu.xn--p1ai}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://s3.xn--80aqenr9bu.xn--p1ai}

    ports:
      - "4004:4000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../:/var/www
      - backend-logs-local:/var/log/app
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "4000", "--reload", "--timeout-graceful-shutdown", "25"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    networks:
      - local-net

  worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: fastapi_pet1-worker-local
    entrypoint:
      - python
      - -m
      - celery
      - -A
      - app.celery_app.app:celery_app
      - worker
      - --loglevel=info
      - -Q
      - default
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@db/fastapi_pet_1}
      SECRET_KEY: ${SECRET_KEY:-abcdefg}
      ALGORITHM: ${ALGORITHM:-HS256}

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-app}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

      # MinIO / S3
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://test.backend.xn--80aqenr9bu.xn--p1ai}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://test.backend.xn--80aqenr9bu.xn--p1ai}
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${WORKER_SERVICE_NAME:-pet1-worker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE_PATH: ${WORKER_LOG_FILE_PATH:-/var/log/app/worker.log}

    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../:/var/www
      - backend-logs-local:/var/log/app
    stop_signal: SIGTERM
    stop_grace_period: 45s
    networks:
      - local-net

  loki:
    image: grafana/loki:3.3.2
    container_name: fastapi_pet1-loki-local
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data-local:/loki
    networks:
      - local-net

  promtail:
    image: grafana/promtail:3.3.2
    container_name: fastapi_pet1-promtail-local
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      loki:
        condition: service_started
      backend:
        condition: service_started
      worker:
        condition: service_started
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - backend-logs-local:/var/log/app:ro
    networks:
      - local-net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: fastapi_pet1-alertmanager-local
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data-local:/alertmanager
    networks:
      - local-net

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: fastapi_pet1-prometheus-local
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_started
      alertmanager:
        condition: service_started
      loki:
        condition: service_started
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data-local:/prometheus
    networks:
      - local-net

  grafana:
    image: grafana/grafana:11.5.2
    container_name: fastapi_pet1-grafana-local
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_METRICS_ENABLED: "true"
    volumes:
      - grafana-data-local:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - local-net

networks:
  local-net:

volumes:
  db-data-local:
  redis-data-local:
  rabbitmq-data-local:
  minio-data-local:
  backend-logs-local:
  prometheus-data-local:
  loki-data-local:
  grafana-data-local:
  alertmanager-data-local:
