global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: pet1-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:4000

  - job_name: pet1-worker
    static_configs:
      - targets:
          - worker:9101

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
