server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pet1-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: pet1-backend
          service: pet1-api
          __path__: /var/log/app/backend.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            request_id: request_id
            event: event
      - labels:
          level:
          logger:
          request_id:
          event:

  - job_name: pet1-worker
    static_configs:
      - targets:
          - localhost
        labels:
          job: pet1-worker
          service: pet1-worker
          __path__: /var/log/app/worker.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            request_id: request_id
            event: event
      - labels:
          level:
          logger:
          request_id:
          event:
