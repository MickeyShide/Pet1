[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    unit: fast isolated tests
    integration: tests that exercise app/database boundaries
    load: lightweight load or concurrency scenarios
    failure: dependency failure or shutdown scenarios
    concurrent_db: allow multiple DB sessions in a test
    db_commit: allow real commits in a test
